[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runapi-grok-imagine"
version = "0.1.2"
description = "RunAPI Grok Imagine SDK for text-to-image, text-to-video, image-to-video, image editing, extension, and upscale workflows in JavaScript, Python, Ruby, Go, Java, and PHP"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "RunAPI", email = "contact@runapi.ai" }]
keywords = ["runapi", "runapi-ai", "grok-imagine", "api", "sdk", "typescript", "python", "ruby", "golang", "java", "maven", "gradle", "image-generation", "video-generation", "text-to-image", "text-to-video", "image-to-video", "image-api", "video-api", "grok-imagine-api"]
dependencies = ["runapi-core>=0.1.6"]

[project.urls]
Homepage = "https://runapi.ai/models/grok-imagine"
Documentation = "https://runapi.ai/docs#sdk-grok-imagine"
Source = "https://github.com/runapi-ai/grok-imagine-sdk"
Issues = "https://github.com/runapi-ai/grok-imagine-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/runapi"]

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=8"]

[tool.runapi]
slug = "grok-imagine"
